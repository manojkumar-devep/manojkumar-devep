<svg width="480" height="220" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="statBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2d1642"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="16" fill="url(#statBg)" stroke="#B06BFF" stroke-opacity="0.35"/>

  <text x="24" y="34" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">📊 GitHub Stats</text>

  <!-- rank ring -->
  <g transform="translate(80,130)">
    <circle r="52" fill="none" stroke="#3a2450" stroke-width="10"/>
    <circle r="52" fill="none" stroke="#B06BFF" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="327" to="80" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </circle>
    <text y="-4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffffff">B+</text>
    <text y="18" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#d9c7ff">RANK</text>
  </g>

  <!-- sliding stat rows: edit the numbers below as your real GitHub stats grow -->
  <g font-family="'Segoe UI', sans-serif" font-size="14" fill="#ffffff">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="40,0;0,0" dur="0.4s" begin="0.4s" fill="freeze" additive="sum"/>
      <text x="180" y="60">🗂️ Public Repos</text>
      <text x="440" y="60" text-anchor="end" font-weight="700" fill="#FFD93D">8+</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="40,0;0,0" dur="0.4s" begin="0.6s" fill="freeze" additive="sum"/>
      <text x="180" y="92">✅ Commits</text>
      <text x="440" y="92" text-anchor="end" font-weight="700" fill="#7ee787">500+</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="40,0;0,0" dur="0.4s" begin="0.8s" fill="freeze" additive="sum"/>
      <text x="180" y="124">⭐ Stars Earned</text>
      <text x="440" y="124" text-anchor="end" font-weight="700" fill="#FFD93D">50+</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="40,0;0,0" dur="0.4s" begin="1.0s" fill="freeze" additive="sum"/>
      <text x="180" y="156">👥 Followers</text>
      <text x="440" y="156" text-anchor="end" font-weight="700" fill="#8be9fd">25+</text>
    </g>
  </g>

  <text x="24" y="204" font-family="Consolas, monospace" font-size="10" fill="#7a6a90">edit stats.svg to update these numbers</text>
</svg>
