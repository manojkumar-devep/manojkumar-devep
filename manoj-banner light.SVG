<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6ff"/>
      <stop offset="45%" stop-color="#f3ecff"/>
      <stop offset="100%" stop-color="#ffeef7"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6BCB"/>
      <stop offset="50%" stop-color="#B06BFF"/>
      <stop offset="100%" stop-color="#6B8CFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="roundedBanner">
      <rect x="0" y="0" width="1280" height="420" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedBanner)">
    <rect width="1280" height="420" fill="url(#bgGrad)"/>

    <!-- ambient pulsing orbs -->
    <circle cx="1150" cy="80" r="90" fill="#B06BFF" opacity="0.10">
      <animate attributeName="r" values="80;110;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="360" r="70" fill="#6B8CFF" opacity="0.10">
      <animate attributeName="r" values="60;90;60" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.16;0.08" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling sparkles -->
    <g fill="#B06BFF">
      <circle cx="200" cy="60" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="40" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="90" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="200" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="220" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="1.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- rising particles -->
    <g fill="#FFD93D" opacity="0.7">
      <circle cx="1180" cy="400" r="3">
        <animate attributeName="cy" values="400;20" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="400" r="2.4">
        <animate attributeName="cy" values="400;30" dur="6.5s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="6.5s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="400" r="2.8">
        <animate attributeName="cy" values="400;10" dur="7s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="7s" begin="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- floating hearts -->
    <g fill="#FF6BCB" opacity="0.65">
      <path d="M1220,340 c-4,-6 -14,-3 -14,5 c0,7 14,16 14,16 c0,0 14,-9 14,-16 c0,-8 -10,-11 -14,-5 z">
        <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="0.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-30" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      </path>
      <path d="M90,120 c-3,-5 -11,-2 -11,4 c0,5 11,12 11,12 c0,0 11,-7 11,-12 c0,-6 -8,-9 -11,-4 z">
        <animate attributeName="opacity" values="0;0.6;0" dur="3.5s" begin="1.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-24" dur="3.5s" begin="1.8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- terminal window -->
    <rect x="48" y="34" width="560" height="34" rx="8" fill="#ffffff" opacity="0.9" stroke="#e4d6ff"/>
    <circle cx="66" cy="51" r="5" fill="#FF5F56"/>
    <circle cx="84" cy="51" r="5" fill="#FFBD2E"/>
    <circle cx="102" cy="51" r="5" fill="#27C93F"/>
    <text x="130" y="56" font-family="Consolas, monospace" font-size="14" fill="#7a3fb5">
      user@github:~$
      <tspan fill="#2d1b4e"> cat README.md</tspan>
    </text>
    <rect x="330" y="43" width="9" height="16" fill="#2d1b4e">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- animated name, letters popping in -->
    <text x="60" y="150" font-family="'Segoe UI', Poppins, sans-serif" font-size="56" font-weight="800" fill="url(#nameGrad)">
      <tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.6s" fill="freeze"/>
      </tspan>M</text>
    <g font-family="'Segoe UI', Poppins, sans-serif" font-size="56" font-weight="800" fill="url(#nameGrad)">
      <text x="60"  y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.55s" fill="freeze"/>M</text>
      <text x="98"  y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.65s" fill="freeze"/>y</text>
      <text x="130" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.75s" fill="freeze"/>c</text>
      <text x="164" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.85s" fill="freeze"/>h</text>
      <text x="200" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.95s" fill="freeze"/>a</text>
      <text x="236" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.05s" fill="freeze"/>r</text>
      <text x="266" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.15s" fill="freeze"/>l</text>
      <text x="282" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.25s" fill="freeze"/>a</text>
      <text x="330" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.4s" fill="freeze"/>M</text>
      <text x="368" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.5s" fill="freeze"/>a</text>
      <text x="404" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.6s" fill="freeze"/>n</text>
      <text x="438" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.7s" fill="freeze"/>o</text>
      <text x="474" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.8s" fill="freeze"/>j</text>
      <text x="490" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.9s" fill="freeze"/>k</text>
      <text x="524" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.0s" fill="freeze"/>u</text>
      <text x="560" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.1s" fill="freeze"/>m</text>
      <text x="596" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.2s" fill="freeze"/>a</text>
      <text x="630" y="150" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.3s" fill="freeze"/>r</text>
    </g>

    <!-- cycling role titles -->
    <g font-family="Consolas, monospace" font-size="22" fill="#2d1b4e">
      <text x="62" y="196" opacity="0">
        &gt;_ Java Full Stack Developer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.42;0.5;1" dur="8s" begin="2.5s" repeatCount="indefinite"/>
      </text>
      <text x="62" y="196" opacity="0">
        &gt;_ IT Student &amp; Java Enthusiast
        <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.5;0.55;0.63;0.92;1" dur="8s" begin="2.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- tagline quote box -->
    <rect x="60" y="228" width="430" height="46" rx="10" fill="#B06BFF" opacity="0">
      <animate attributeName="opacity" from="0" to="0.08" dur="0.6s" begin="3.2s" fill="freeze"/>
    </rect>
    <text x="80" y="257" font-family="'Segoe UI', sans-serif" font-size="16" font-style="italic" fill="#B36B00" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.2s" fill="freeze"/>
      "Code. Learn. Build. Repeat."
    </text>

    <!-- tech pills fading in -->
    <g font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600">
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.6s" fill="freeze"/>
        <rect x="60" y="292" width="60" height="30" rx="15" fill="#ED8B00"/><text x="76" y="312" fill="#fff">Java</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.75s" fill="freeze"/>
        <rect x="130" y="292" width="104" height="30" rx="15" fill="#6DB33F"/><text x="144" y="312" fill="#fff">Spring Boot</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.9s" fill="freeze"/>
        <rect x="244" y="292" width="120" height="30" rx="15" fill="#4169E1"/><text x="258" y="312" fill="#fff">PostgreSQL</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.05s" fill="freeze"/>
        <rect x="374" y="292" width="94" height="30" rx="15" fill="#4479A1"/><text x="388" y="312" fill="#fff">MySQL</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.2s" fill="freeze"/>
        <rect x="478" y="292" width="128" height="30" rx="15" fill="#005571"/><text x="492" y="312" fill="#fff">REST APIs</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.35s" fill="freeze"/>
        <rect x="616" y="292" width="150" height="30" rx="15" fill="#8A2BE2"/><text x="630" y="312" fill="#fff">Automata &amp; CD</text></g>
    </g>

    <!-- code editor card, typing buildDreams() -->
    <g transform="translate(700,60)">
      <rect width="500" height="220" rx="12" fill="#ffffff" stroke="#B06BFF" stroke-opacity="0.35"/>
      <circle cx="20" cy="20" r="5" fill="#FF5F56"/>
      <circle cx="38" cy="20" r="5" fill="#FFBD2E"/>
      <circle cx="56" cy="20" r="5" fill="#27C93F"/>
      <text x="20" y="55" font-family="Consolas, monospace" font-size="14" fill="#B06BFF" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1s" fill="freeze"/>
        function buildDreams() {
      </text>
      <text x="40" y="80" font-family="Consolas, monospace" font-size="14" fill="#8be9fd" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.6s" fill="freeze"/>
        const stack = ["Java","Spring","SQL"];
      </text>
      <text x="40" y="105" font-family="Consolas, monospace" font-size="14" fill="#FFD93D" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.2s" fill="freeze"/>
        return learn(stack).then(ship);
      </text>
      <text x="20" y="130" font-family="Consolas, monospace" font-size="14" fill="#B06BFF" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.8s" fill="freeze"/>
        &#125;
      </text>
      <rect x="20" y="150" width="460" height="1" fill="#B06BFF" opacity="0.25"/>
      <text x="20" y="180" font-family="Consolas, monospace" font-size="13" fill="#1a8a4a" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.2s" fill="freeze"/>
        &gt; build successful ✓
      </text>
    </g>

    <!-- neon sign flicker -->
    <text x="700" y="335" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#C23FA0" opacity="0.9"
          style="text-shadow:0 0 8px #C23FA0;">
      KEEP CODING · KEEP GROWING
      <animate attributeName="opacity" values="0.9;0.9;0.2;0.9;0.9;0.15;0.9" keyTimes="0;0.3;0.32;0.34;0.7;0.72;1" dur="3.6s" repeatCount="indefinite"/>
    </text>

    <!-- scanner sweep, continuous -->
    <rect x="0" y="-30" width="1280" height="30" fill="#B06BFF" opacity="0.16">
      <animate attributeName="y" values="-30;420" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
