<svg width="380" height="220" viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2d1642"/>
    </linearGradient>
  </defs>
  <rect width="380" height="220" rx="16" fill="url(#langBg)" stroke="#B06BFF" stroke-opacity="0.35"/>
  <text x="24" y="34" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">🧠 Top Languages</text>

  <!-- edit widths/percents below to match your real GitHub language breakdown -->
  <g font-family="'Segoe UI', sans-serif" font-size="13" fill="#ffffff">
    <text x="24" y="66">Java</text>
    <rect x="24" y="74" width="300" height="10" rx="5" fill="#3a2450"/>
    <rect x="24" y="74" height="10" rx="5" fill="#ED8B00" width="0">
      <animate attributeName="width" from="0" to="192" dur="1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </rect>
    <text x="330" y="83" text-anchor="end" fill="#d9c7ff">55%</text>

    <text x="24" y="106">SQL / PostgreSQL</text>
    <rect x="24" y="114" width="300" height="10" rx="5" fill="#3a2450"/>
    <rect x="24" y="114" height="10" rx="5" fill="#4169E1" width="0">
      <animate attributeName="width" from="0" to="90" dur="1s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </rect>
    <text x="330" y="123" text-anchor="end" fill="#d9c7ff">25%</text>

    <text x="24" y="146">HTML / CSS / JS</text>
    <rect x="24" y="154" width="300" height="10" rx="5" fill="#3a2450"/>
    <rect x="24" y="154" height="10" rx="5" fill="#F0DB4F" width="0">
      <animate attributeName="width" from="0" to="54" dur="1s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </rect>
    <text x="330" y="163" text-anchor="end" fill="#d9c7ff">15%</text>

    <text x="24" y="186">Other</text>
    <rect x="24" y="194" width="300" height="10" rx="5" fill="#3a2450"/>
    <rect x="24" y="194" height="10" rx="5" fill="#8A2BE2" width="0">
      <animate attributeName="width" from="0" to="18" dur="1s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/>
    </rect>
    <text x="330" y="203" text-anchor="end" fill="#d9c7ff">5%</text>
  </g>
</svg>
