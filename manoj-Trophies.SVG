<svg width="620" height="200" viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2d1642"/>
    </linearGradient>
    <linearGradient id="cellShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="620" height="200" rx="16" fill="url(#trophyBg)" stroke="#B06BFF" stroke-opacity="0.35"/>
  <text x="24" y="34" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">🏆 Achievements</text>

  <!-- 4 trophy cells popping in, each with a glowing rank and shine sweep -->
  <g font-family="'Segoe UI', sans-serif">
    <!-- Java -->
    <g transform="translate(24,54)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.7;1.05;1" keyTimes="0;0.7;1" dur="0.45s" begin="0.2s" fill="freeze" additive="sum"/>
      <rect width="130" height="120" rx="12" fill="#241338" stroke="#ED8B00" stroke-opacity="0.6"/>
      <text x="65" y="46" text-anchor="middle" font-size="30">☕</text>
      <text x="65" y="72" text-anchor="middle" font-size="12" fill="#ffffff">Java Craftsman</text>
      <text x="65" y="94" text-anchor="middle" font-size="18" font-weight="800" fill="#ED8B00">A</text>
      <rect width="130" height="120" rx="12" fill="url(#cellShine)" transform="translate(-130,0)">
        <animate attributeName="transform" values="translate(-130,0);translate(130,0)" dur="3s" begin="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- SQL -->
    <g transform="translate(166,54)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.7;1.05;1" keyTimes="0;0.7;1" dur="0.45s" begin="0.4s" fill="freeze" additive="sum"/>
      <rect width="130" height="120" rx="12" fill="#241338" stroke="#4169E1" stroke-opacity="0.6"/>
      <text x="65" y="46" text-anchor="middle" font-size="30">🗄️</text>
      <text x="65" y="72" text-anchor="middle" font-size="12" fill="#ffffff">SQL Strategist</text>
      <text x="65" y="94" text-anchor="middle" font-size="18" font-weight="800" fill="#4169E1">A</text>
      <rect width="130" height="120" rx="12" fill="url(#cellShine)" transform="translate(-130,0)">
        <animate attributeName="transform" values="translate(-130,0);translate(130,0)" dur="3s" begin="1.3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Consistency -->
    <g transform="translate(308,54)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.7;1.05;1" keyTimes="0;0.7;1" dur="0.45s" begin="0.6s" fill="freeze" additive="sum"/>
      <rect width="130" height="120" rx="12" fill="#241338" stroke="#7ee787" stroke-opacity="0.6"/>
      <text x="65" y="46" text-anchor="middle" font-size="30">🔥</text>
      <text x="65" y="72" text-anchor="middle" font-size="12" fill="#ffffff">Consistent Committer</text>
      <text x="65" y="94" text-anchor="middle" font-size="18" font-weight="800" fill="#7ee787">B+</text>
      <rect width="130" height="120" rx="12" fill="url(#cellShine)" transform="translate(-130,0)">
        <animate attributeName="transform" values="translate(-130,0);translate(130,0)" dur="3s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Growth -->
    <g transform="translate(450,54)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.7;1.05;1" keyTimes="0;0.7;1" dur="0.45s" begin="0.8s" fill="freeze" additive="sum"/>
      <rect width="130" height="120" rx="12" fill="#241338" stroke="#FF6BCB" stroke-opacity="0.6"/>
      <text x="65" y="46" text-anchor="middle" font-size="30">🚀</text>
      <text x="65" y="72" text-anchor="middle" font-size="12" fill="#ffffff">Rising Builder</text>
      <text x="65" y="94" text-anchor="middle" font-size="18" font-weight="800" fill="#FF6BCB">B</text>
      <rect width="130" height="120" rx="12" fill="url(#cellShine)" transform="translate(-130,0)">
        <animate attributeName="transform" values="translate(-130,0);translate(130,0)" dur="3s" begin="1.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
